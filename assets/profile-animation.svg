<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020617"/>
    <stop offset=".45" stop-color="#07111f"/>
    <stop offset="1" stop-color="#020617"/>
  </linearGradient>
  <radialGradient id="orb">
    <stop offset="0" stop-color="#00e5ff" stop-opacity=".35"/>
    <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#00e5ff" stroke-opacity=".07"/>
  </pattern>
  <clipPath id="clip"><rect width="1200" height="300" rx="20"/></clipPath>
</defs>

<rect width="1200" height="300" rx="20" fill="url(#bg)"/>
<rect width="1200" height="300" rx="20" fill="url(#grid)"/>

<!-- animated neon atmosphere -->
<circle cx="160" cy="145" r="170" fill="url(#orb)">
  <animate attributeName="cx" values="160;360;160" dur="9s" repeatCount="indefinite"/>
</circle>
<circle cx="1030" cy="150" r="190" fill="url(#orb)">
  <animate attributeName="cx" values="1030;850;1030" dur="11s" repeatCount="indefinite"/>
</circle>

<!-- matrix-style falling code -->
<g font-family="monospace" font-size="13" fill="#00e5ff" opacity=".32" clip-path="url(#clip)">
  <text x="35" y="-20">01010110<tspan x="35" dy="18">11001001</tspan><tspan x="35" dy="18">10110101</tspan><tspan x="35" dy="18">00101110</tspan><animateTransform attributeName="transform" type="translate" from="0 0" to="0 280" dur="5s" repeatCount="indefinite"/></text>
  <text x="155" y="-150">10100101<tspan x="155" dy="18">01101010</tspan><tspan x="155" dy="18">11010011</tspan><tspan x="155" dy="18">01011001</tspan><animateTransform attributeName="transform" type="translate" from="0 0" to="0 430" dur="7s" repeatCount="indefinite"/></text>
  <text x="980" y="-80">11010110<tspan x="980" dy="18">00110101</tspan><tspan x="980" dy="18">10101001</tspan><tspan x="980" dy="18">11100010</tspan><animateTransform attributeName="transform" type="translate" from="0 0" to="0 360" dur="6s" repeatCount="indefinite"/></text>
  <text x="1110" y="-180">01101101<tspan x="1110" dy="18">10010110</tspan><tspan x="1110" dy="18">01010111</tspan><tspan x="1110" dy="18">11001010</tspan><animateTransform attributeName="transform" type="translate" from="0 0" to="0 480" dur="8s" repeatCount="indefinite"/></text>
</g>

<!-- neon network -->
<g stroke="#00e5ff" fill="none" stroke-opacity=".28">
  <path d="M20 235 L170 95 L310 210 L470 65 L620 225 L790 80 L950 215 L1175 55">
    <animate attributeName="stroke-opacity" values=".08;.5;.08" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M35 65 L210 220 L390 90 L560 235 L735 70 L900 225 L1080 90 L1180 230" stroke="#7c3aed"/>
</g>

<g fill="#00e5ff" filter="url(#glow)">
  <circle cx="170" cy="95" r="4"><animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="310" cy="210" r="4"><animate attributeName="r" values="3;7;3" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="470" cy="65" r="4"><animate attributeName="r" values="3;7;3" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="620" cy="225" r="4"><animate attributeName="r" values="3;7;3" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="790" cy="80" r="4"><animate attributeName="r" values="3;7;3" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="950" cy="215" r="4"><animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite"/></circle>
</g>

<!-- scanline -->
<rect x="0" y="-8" width="1200" height="4" fill="#00e5ff" opacity=".35" filter="url(#glow)">
  <animate attributeName="y" from="-8" to="300" dur="4s" repeatCount="indefinite"/>
</rect>

<!-- terminal panel -->
<rect x="365" y="55" width="470" height="190" rx="14" fill="#020617" fill-opacity=".86" stroke="#00e5ff" stroke-opacity=".45"/>
<circle cx="390" cy="80" r="5" fill="#ff5f56"/>
<circle cx="407" cy="80" r="5" fill="#ffbd2e"/>
<circle cx="424" cy="80" r="5" fill="#27c93f"/>

<text x="390" y="115" fill="#00e5ff" font-family="monospace" font-size="15">$ whoami</text>
<text x="390" y="140" fill="#f0f6fc" font-family="monospace" font-size="22" font-weight="700">vaibhvendra@cybersec</text>
<text x="390" y="168" fill="#8b949e" font-family="monospace" font-size="14">$ ./build_secure_future.sh</text>
<text x="390" y="195" fill="#27c93f" font-family="monospace" font-size="14">[✓] DSA  [✓] SECURITY  [✓] CODE</text>
<text x="390" y="220" fill="#00e5ff" font-family="monospace" font-size="13">ACCESS: GRANTED_</text>
<rect x="510" y="209" width="8" height="14" fill="#00e5ff">
  <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
</rect>
</svg>