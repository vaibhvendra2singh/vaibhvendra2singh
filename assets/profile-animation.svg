<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#0d1117"/>
    <stop offset="0.5" stop-color="#111827"/>
    <stop offset="1" stop-color="#0d1117"/>
    <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="12s" repeatCount="indefinite"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#58a6ff" stroke-opacity=".08"/>
  </pattern>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1200" height="260" rx="18" fill="url(#bg)"/>
<rect width="1200" height="260" rx="18" fill="url(#grid)"/>

<g fill="#58a6ff" filter="url(#glow)">
  <circle cx="70" cy="190" r="2"><animate attributeName="cy" values="190;45;190" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="180" cy="60" r="2"><animate attributeName="cx" values="180;1080;180" dur="14s" repeatCount="indefinite"/></circle>
  <circle cx="330" cy="210" r="2"><animate attributeName="cy" values="210;25;210" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="520" cy="45" r="2"><animate attributeName="cx" values="520;1150;520" dur="11s" repeatCount="indefinite"/></circle>
  <circle cx="690" cy="220" r="2"><animate attributeName="cy" values="220;35;220" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="850" cy="55" r="2"><animate attributeName="cx" values="850;90;850" dur="13s" repeatCount="indefinite"/></circle>
  <circle cx="1030" cy="200" r="2"><animate attributeName="cy" values="200;30;200" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="1140" cy="75" r="2"><animate attributeName="cx" values="1140;180;1140" dur="15s" repeatCount="indefinite"/></circle>
</g>

<g stroke="#58a6ff" stroke-opacity=".18" fill="none">
  <path d="M0 220 Q300 80 600 180 T1200 90">
    <animate attributeName="stroke-opacity" values=".08;.35;.08" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M0 80 Q300 220 600 90 T1200 190">
    <animate attributeName="stroke-opacity" values=".3;.06;.3" dur="7s" repeatCount="indefinite"/>
  </path>
</g>

<text x="600" y="112" text-anchor="middle" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="34" font-weight="700">CYBERSECURITY • CODE • DSA</text>
<text x="600" y="145" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="15">Software Engineering · Security · Problem Solving</text>
</svg>