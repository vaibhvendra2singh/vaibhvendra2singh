<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#0b1220"/><stop offset=".5" stop-color="#111827"/><stop offset="1" stop-color="#0b1220"/>
  </linearGradient>
  <linearGradient id="line" x1="0" x2="1"><stop stop-color="#60a5fa" stop-opacity="0"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
  <radialGradient id="blue"><stop stop-color="#3b82f6" stop-opacity=".18"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
  <radialGradient id="violet"><stop stop-color="#8b5cf6" stop-opacity=".14"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".05"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="1200" height="280" rx="16"/></clipPath>
</defs>

<rect width="1200" height="280" rx="16" fill="url(#bg)"/>
<rect width="1200" height="280" rx="16" fill="url(#grid)"/>

<g clip-path="url(#clip)">
  <ellipse cx="140" cy="110" rx="300" ry="180" fill="url(#blue)" filter="url(#blur)">
    <animate attributeName="cx" values="140;300;140" dur="14s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1060" cy="175" rx="300" ry="180" fill="url(#violet)" filter="url(#blur)">
    <animate attributeName="cx" values="1060;900;1060" dur="16s" repeatCount="indefinite"/>
  </ellipse>

  <path d="M-80 215 C170 90 330 250 580 125 S980 35 1280 160" fill="none" stroke="#60a5fa" stroke-opacity=".16" stroke-width="1.5">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M-80 70 C200 195 390 35 630 150 S980 250 1280 85" fill="none" stroke="#8b5cf6" stroke-opacity=".13" stroke-width="1.5">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- subtle data points -->
  <g fill="#93c5fd">
    <circle cx="115" cy="72" r="1.7"><animate attributeName="opacity" values=".15;.8;.15" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="205" r="1.4"><animate attributeName="opacity" values=".7;.15;.7" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="50" r="1.5"><animate attributeName="opacity" values=".15;.75;.15" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="210" r="1.5"><animate attributeName="opacity" values=".7;.15;.7" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="965" cy="65" r="1.7"><animate attributeName="opacity" values=".15;.8;.15" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="175" r="1.4"><animate attributeName="opacity" values=".7;.15;.7" dur="4.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- restrained scanning accent -->
  <rect x="-20" y="0" width="2" height="280" fill="#60a5fa" opacity=".16">
    <animate attributeName="x" from="-20" to="1220" dur="10s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- professional identity -->
<text x="600" y="108" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" letter-spacing="1">VAIBHVENDRA SINGH</text>

<text x="600" y="143" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="3">CYBERSECURITY • SOFTWARE ENGINEERING • DSA</text>

<rect x="425" y="166" width="350" height="1" fill="url(#line)">
  <animate attributeName="opacity" values=".4;1;.4" dur="4s" repeatCount="indefinite"/>
</rect>

<text x="600" y="198" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="14">B.Tech Cybersecurity · Bennett University</text>
<text x="600" y="226" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="12">CODE  /  SECURE SYSTEMS  /  PROBLEM SOLVING</text>

<rect x="1" y="1" width="1198" height="278" rx="16" fill="none" stroke="#334155" stroke-opacity=".7"/>
</svg>