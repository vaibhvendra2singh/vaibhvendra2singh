<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#0b1220"/><stop offset=".5" stop-color="#101827"/><stop offset="1" stop-color="#0b1220"/>
  </linearGradient>
  <radialGradient id="a"><stop stop-color="#3b82f6" stop-opacity=".20"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
  <radialGradient id="b"><stop stop-color="#8b5cf6" stop-opacity=".16"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".055"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  <clipPath id="clip"><rect width="1200" height="260" rx="16"/></clipPath>
</defs>
<rect width="1200" height="260" rx="16" fill="url(#bg)"/>
<rect width="1200" height="260" rx="16" fill="url(#grid)"/>

<g clip-path="url(#clip)">
  <ellipse cx="180" cy="90" rx="280" ry="170" fill="url(#a)" filter="url(#blur)">
    <animate attributeName="cx" values="180;330;180" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;150;90" dur="10s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1020" cy="180" rx="300" ry="170" fill="url(#b)" filter="url(#blur)">
    <animate attributeName="cx" values="1020;870;1020" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="180;100;180" dur="11s" repeatCount="indefinite"/>
  </ellipse>

  <path d="M-100 210 C180 80 300 250 570 125 S950 30 1300 160" fill="none" stroke="#60a5fa" stroke-opacity=".18" stroke-width="1.5">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 18;0 0" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M-100 70 C190 200 370 30 620 150 S970 250 1300 80" fill="none" stroke="#a78bfa" stroke-opacity=".14" stroke-width="1.5">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -16;0 0" dur="10s" repeatCount="indefinite"/>
  </path>

  <g fill="#93c5fd">
    <circle cx="120" cy="72" r="1.7"><animate attributeName="opacity" values=".15;.8;.15" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="190" r="1.4"><animate attributeName="opacity" values=".7;.15;.7" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="52" r="1.5"><animate attributeName="opacity" values=".15;.75;.15" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="205" r="1.5"><animate attributeName="opacity" values=".7;.15;.7" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="70" r="1.7"><animate attributeName="opacity" values=".15;.8;.15" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="170" r="1.4"><animate attributeName="opacity" values=".7;.15;.7" dur="4.2s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="-30" y="0" width="2" height="260" fill="#60a5fa" opacity=".12">
    <animate attributeName="x" from="-30" to="1230" dur="9s" repeatCount="indefinite"/>
  </rect>
</g>

<rect x="1" y="1" width="1198" height="258" rx="16" fill="none" stroke="#334155" stroke-opacity=".65"/>
</svg>