name: Update Code360 Stats

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/code360.py"
      - ".github/workflows/code360.yml"

permissions:
  contents: write

jobs:
  update-code360:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update Code360 stats
        run: python .github/code360.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/code360-stats.svg
          if git diff --cached --quiet; then
            echo "No Code360 changes."
          else
            git commit -m "chore: update Code360 stats"
            git push
          fi
          
          # Direct API sync; generated SVG keeps README lightweight.
